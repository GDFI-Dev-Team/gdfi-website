backend:
  name: github
  repo: GDFI-Dev-Team/gdfi-website
  base_url: https://sveltia-cms-auth.raki-rarufu-dev.workers.dev # handoff CMS authentication Cloudflare worker

media_folder: /public/media

slug:
  encoding: ascii # to sanitize emojis in title

media_libraries:
  # handoff later
  cloudflare_r2: 
    access_key_id: 9c671155033e705d9900c1857e7b81cc
    bucket: sveltia-media
    account_id: ffa0678267bca3257f3209173022c26f 
    public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
    prefix: gdfi-website-uploads/
  all:
    transformations:
      raster_image:
        format: webp
      svg:
        optimize: true

collections:
  - name: annual-reports
    label: Annual Reports
    label_singular: Annual Report
    folder: content/resources/annual-and-financial-reports
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. 2026 Annual Report
      - name: year
        label: Year
        widget: string
        hint: ex. 2026
      - name: prepared-by
        label: Prepared By
        widget: string
        required: false
      - name: annual-report
        label: Annual Report
        widget: file
        max: 1
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/annual-and-financial-reports
          default: false

  - name: publications
    label: Research & Publications
    folder: content/resources/research-and-publications
    create: true
    fields:
      - name: title
        label: Title
        widget: string
        hint: ex. Reef Fish Biomass Recovery in Eastern Samar MPAs
      - name: authors
        label: Authors
        widget: string
        hint: Comma-separated, ex. J. Laurente, M. Dela Cruz
      - name: year
        label: Year
        widget: string
        default: "2026"
        hint: ex. 2026
      - name: outlet
        label: Journal / Outlet
        widget: string
        required: false
        hint: Journal, publisher, or venue, ex. Marine Pollution Bulletin
      - name: volume
        label: Volume / Issue
        widget: string
        required: false
        hint: ex. 109(2) or 541
      - name: pages
        label: Pages / Article
        widget: string
        required: false
        hint: ex. 744-750 or e70016
      - name: link
        label: External link
        widget: string
        required: false
        hint: URL to the article (Google Scholar, DOI, journal page)
      - label: PDF
        name: pdf
        widget: file
        max: 1
        required: false
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/research-and-publications
          default: false

  - name: programs
    label: Programs & Projects
    label_singular: Program / Project
    folder: content/our-works/programs-and-projects
    fields:
      - name: title
        label: Title
        widget: string
        hint: ex. Educational Assistance Program
      - name: short-description
        label: Short Description
        widget: text
      - name: date
        label: Date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: Used to order entries — the 5 most recent are featured in the hero.
      - name: status
        label: Status
        widget: relation
        collection: program-statuses
        value_field: name
        hint: Pulled from Program Statuses — manage the list in that collection
      - name: featured
        label: Featured
        widget: boolean
        default: false
        hint: Toggle to feature this program in the homepage hero slideshow.
      - name: tag
        label: Tag
        widget: relation
        collection: program-categories
        value_field: name
        required: false
        hint: Pulled from Program Categories — manage the list in that collection
      - name: partners
        label: Partners / Type
        widget: text
        required: false
        hint: Partner organisations and partnership type.
      - name: timeline
        label: Timeline
        widget: string
        required: false
        hint: eg. Aug 2018 – 2023
      - name: featured-img
        label: Featured Image
        widget: file
        max: 1
        accept: "image/jpeg,.jpg,.jpeg,image/png,.png,image/webp,.webp"
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/programs-and-projects
          default: false
      - name: body
        label: Content
        widget: markdown
        default: |
          ## About This Program

          Expand the short overview of the program here. Explain who it serves, what problem it addresses, and why it matters.

          ## Goals

          - Goal one
          - Goal two
          - Goal three

          ## Impact

          Describe the outcomes or results of the program so far. Include numbers or stories if available.

          ## How to Get Involved

          Explain how someone (a donor, volunteer, or participant) can support or join this program.

  - name: program-categories
    label: Program Categories
    label_singular: Program Category
    folder: content/our-works/program-categories
    create: true
    identifier_field: name
    fields:
      - name: name
        label: Name
        widget: string
        hint: ex. Governance, Conservation, Research, MPA, Livelihood

  - name: program-statuses
    label: Program Statuses
    label_singular: Program Status
    folder: content/our-works/program-statuses
    create: true
    identifier_field: name
    fields:
      - name: name
        label: Name
        widget: string
        hint: ex. Active, Completed, Discontinued

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: content/updates/announcements
    fields:
      - name: title 
        label: Title
        widget: string
      - name: author 
        label: Author
        widget: string
        required: false
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: featured_images
        label: Featured Images
        widget: image
        multiple: true
        required: false
        media_libraries:
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/announcements
          default: false
      - name: body
        label: Body
        widget: markdown
        default: |
          ## Overview

          Write a short, attention-grabbing opening line that restates or expands on the title.

          ## What Happened

          Give the context: what happened, who was involved, and why it matters to GDFI's mission.

          ## Key Details

          - Detail, quote, or number one
          - Detail, quote, or number two
          - Detail, quote, or number three

          ## What's Next

          End with a call to action or forward-looking note (e.g. how to get involved, what's next).

  - name: community-categories
    label: Community Categories
    label_singular: Community Category
    folder: content/updates/community-categories
    create: true
    fields:
      - name: name
        label: Name
        widget: string
        hint: ex. Fisherfolk, Youth, Livelihood, Conservation

  - name: community-stories
    label: Community Stories
    label_singular: Community Story
    folder: content/updates/community-stories
    create: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: tags
        label: Categories
        widget: relation
        collection: community-categories
        value_field: name
        multiple: true
        required: false
        hint: Pulled from Community Categories — manage the list in that collection
      - name: featured_images
        label: Featured Images
        widget: image
        multiple: true
        required: false
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/community-stories
          default: false
      - name: body
        label: Body
        widget: markdown
        default: |
          ## The Story

          Open with a short, vivid line that draws the reader into the story.

          ## Who & Where

          Introduce the community member(s) and the place at the heart of this story.

          ## What Changed

          Share what changed, what was learned, or what was achieved — and why it matters to GDFI's mission.

          ## Looking Ahead

          Close with a forward-looking note or a call to action.

  - name: video-resources
    label: Video Resources
    label_singular: Video Resource
    folder: content/resources/video-and-media-resources
    fields: 
      - label: Title
        name: title
        widget: string
      - label: Featured
        name: featured
        widget: boolean
        hint: Toggle for featured videos
        default: false
      - label: Excerpt
        name: excerpt
        widget: string
        required: false
      - label: Body
        name: body
        widget: richtext
      - label: Youtube Link
        name: youtube-link
        widget: string

  - name: org-structures
    label: Org Structures
    label_singular: Org Structure
    folder: content/about-us/organizational-structure
    create: true
    identifier_field: name
    fields:
      - name: name
        label: Name
        widget: string
        hint: ex. Board of Trustees, Admin and Finance, Project Coordination, Pool of Volunteers

  - name: personnel
    label: Personnel
    label_singular: Person
    folder: content/about-us/personnel
    create: true
    fields:
      - name: name
        label: Name
        widget: string
      - name: role
        label: Role
        widget: string
        hint: ex. President & Executive Director
      - name: structure
        label: Structure
        widget: relation
        collection: org-structures
        value_field: name
        hint: Pulled from Org Structures — manage the list in that collection
      - name: order
        label: Order
        widget: number
        value_type: int
        default: 1
        hint: Position within the structure (1 = first). In Board of Trustees, 1 = President, 2 = Vice-President, 3–4 = officers, 5+ = members.
      - name: image
        label: Photo
        widget: image
        required: false
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/personnel
          default: false
      - name: bio
        label: Bio
        widget: text
        required: false
