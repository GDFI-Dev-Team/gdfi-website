backend:
  name: github
  repo: GDFI-Dev-Team/gdfi-website
  base_url: https://sveltia-cms-auth.raki-rarufu-dev.workers.dev # handoff CMS authentication Cloudflare worker
media_folder: /public/media
public_folder: /media

slug:
  encoding: ascii # to sanitize emojis in title

media_libraries:
  # handoff later
  cloudflare_r2: 
    access_key_id: 9c671155033e705d9900c1857e7b81cc
    bucket: sveltia-media
    account_id: ffa0678267bca3257f3209173022c26f 
    public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
    prefix: gdfi-website-uploads/
  all:
    transformations:
      raster_image:
        format: webp
      svg:
        optimize: true

collections:
  - name: annual-reports
    label: Annual Reports
    label_singular: Annual Report
    folder: content/resources/annual-reports
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. 2026 Annual Report
      - name: year
        label: Year
        widget: string
        hint: ex. 2026
      - name: prepared-by
        label: Prepared By
        widget: string
        required: false
      - name: annual-report
        label: Annual Report
        widget: file
        max: 1
        accept: application/pdf,.pdf
        media_libraries: 
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/annual-reports
          default: false

  - name: programs
    label: Programs
    label_singular: Program
    folder: content/programs
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. Educational Assistance Program
      - name: short-description
        label: Short Description    
        widget: text
      - name: status
        label: Status
        widget: select
        options: ['Completed', 'Active', 'Discontinued']
      - name: tag
        label: Tag
        widget: string
        hint: eg. Education
        required: false
      - name: featured-img
        label: Featured Image
        widget: file
        max: 1
        accept: "image/jpeg,.jpg,.jpeg"
      - name: body
        label: Content
        widget: markdown
        default: |
          ## About This Program

          Expand the short overview of the program here. Explain who it serves, what problem it addresses, and why it matters.

          ## Goals

          - Goal one
          - Goal two
          - Goal three

          ## Impact

          Describe the outcomes or results of the program so far. Include numbers or stories if available.

          ## How to Get Involved

          Explain how someone (a donor, volunteer, or participant) can support or join this program.

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: content/updates/announcements
    fields:
      - name: title 
        label: Title
        widget: string
      - name: author 
        label: Author
        widget: string
        required: false
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: excerpt
        label: Excerpt
        widget: string
        required: false
      - name: featured_image 
        label: Featured Image
        widget: image
        multiple: true
        required: false
        media_libraries:
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/web-assets
          default: false
      - name: body 
        label: Body
        widget: text
        default: |
          Write a short, attention-grabbing opening line that restates or expands on the title.

          Give the context: what happened, who was involved, and why it matters to GDFI's mission.

          Share any key details, quotes, or numbers that support the announcement.

          End with a call to action or forward-looking note (e.g. how to get involved, what's next).
  - name: videos
    label: Videos
    label_singular: Video
    folder: content/resources/videos
    fields: 
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, type: date }
      - label: Tags
        name: tags
        widget: relation
        collection: video_tags
        required: false
        multiple: true
        display_fields: [title]
        search_fields: [title, description]
      - { label: Excerpt, name: excerpt, widget: string, required: false }
      - { label: Body, name: body, widget: richtext }
      - { label: Video Link (youtube), name: url, widget: string }
  - name: video_tags # separate for future additions
    label: Tags - Videos
    label_singular: Video Tag
    folder: /content/video_tags
    fields:
      - name: title
        label: Title
      - name: description
        label: Description
        widget: text
        required: false
    
