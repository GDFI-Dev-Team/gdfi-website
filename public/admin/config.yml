# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: GDFI-Dev-Team/gdfi-website
  base_url: https://sveltia-cms-auth.raki-rarufu-dev.workers.dev # handoff CMS authentication Cloudflare worker
media_folder: /public/media
public_folder: /media

slug:
  encoding: ascii # to sanitize emojis in title

media_libraries:
  # handoff later
  cloudflare_r2: 
    access_key_id: 9c671155033e705d9900c1857e7b81cc
    bucket: sveltia-media
    account_id: ffa0678267bca3257f3209173022c26f 
    public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
    prefix: gdfi-website-uploads/
  all:
    transformations:
      raster_image:
        format: webp
      svg:
        optimize: true

collections:
  - name: annual-reports
    label: Annual Reports
    folder: content/resources/annual-reports
    fields:
      - name: title
        label: Title 
        widget: string
        default: 2026 Annual Report
        hint: ex. 2026 Annual Report
      - name: year
        label: Year
        widget: string
        default: "2026"
        hint: ex. 2026
      - name: prepared-by
        label: Prepared By
        widget: string
        required: false
      - label: Annual Report
        name: annual-report
        widget: file
        max: 1
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/annual-reports
          default: false

  - name: publications
    label: Publications
    folder: content/research/publications
    create: true
    slug: '{{year}}-{{slug}}'
    summary: '{{year}} — {{title}}'
    fields:
      - name: title
        label: Title
        widget: string
        hint: ex. Reef Fish Biomass Recovery in Eastern Samar MPAs
      - name: authors
        label: Authors
        widget: string
        hint: Comma-separated, ex. J. Laurente, M. Dela Cruz
      - name: year
        label: Year
        widget: string
        default: "2026"
        hint: ex. 2026
      - name: outlet
        label: Journal / Outlet
        widget: string
        required: false
        hint: Journal, publisher, or venue, ex. Marine Pollution Bulletin
      - name: volume
        label: Volume / Issue
        widget: string
        required: false
        hint: ex. 109(2) or 541
      - name: pages
        label: Pages / Article
        widget: string
        required: false
        hint: ex. 744-750 or e70016
      - name: citedBy
        label: Cited by
        widget: string
        required: false
        hint: Citation count, ex. 91
      - name: link
        label: External link
        widget: string
        required: false
        hint: URL to the article (Google Scholar, DOI, journal page)
      - label: PDF
        name: pdf
        widget: file
        max: 1
        required: false
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/publications
          default: false

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: content/updates/announcements
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Excerpt, name: excerpt, widget: string, required: false }
      - label: Featured Image
        name: featured_image
        widget: image
        multiple: true
        required: false
        media_libraries:
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/web-assets
          default: false
      - { label: Body, name: body, widget: richtext }
