# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: GDFI-Dev-Team/gdfi-website
  base_url: https://sveltia-cms-auth.raki-rarufu-dev.workers.dev # handoff CMS authentication Cloudflare worker
media_folder: /public/media
public_folder: /media

media_libraries:
  # handoff later
  cloudflare_r2: 
    access_key_id: 9c671155033e705d9900c1857e7b81cc
    bucket: sveltia-media
    account_id: ffa0678267bca3257f3209173022c26f 
    public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
    prefix: gdfi-website-uploads/
  all:
    transformations:
      raster_image:
        format: webp
      svg:
        optimize: true

collections:
  - name: annual-reports
    label: Annual Reports
    label_singular: Annual Report
    folder: content/resources/annual-reports
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. 2026 Annual Report
      - name: year
        label: Year
        widget: string
        hint: ex. 2026
      - name: prepared-by
        label: Prepared By
        widget: string
        required: false
      - name: annual-report
        label: Annual Report
        widget: file
        max: 1
        accept: application/pdf,.pdf
        media_libraries: 
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/annual-reports
          default: false
  - name: programs
    label: Programs
    label_singular: Program
    folder: content/programs
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. Educational Assistance Program
      - name: short-description
        label: Short Description    
        widget: text
      - name: status
        label: Status
        widget: select
        options: ['Completed', 'Active', 'Discontinued']
      - name: tag
        label: Tag
        widget: string
        hint: eg. Education
      - name: featured-img
        label: Featured Image
        widget: file
        max: 1
        accept: "image/jpeg,.jpg,.jpeg"
      - name: 
      

