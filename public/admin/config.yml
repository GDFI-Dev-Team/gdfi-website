backend:
  name: github
  repo: GDFI-Dev-Team/gdfi-website
  base_url: https://sveltia-cms-auth.raki-rarufu-dev.workers.dev # handoff CMS authentication Cloudflare worker
media_folder: /public/media
public_folder: /media

slug:
  encoding: ascii # to sanitize emojis in title

media_libraries:
  # handoff later
  cloudflare_r2: 
    access_key_id: 9c671155033e705d9900c1857e7b81cc
    bucket: sveltia-media
    account_id: ffa0678267bca3257f3209173022c26f 
    public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
    prefix: gdfi-website-uploads/
  all:
    transformations:
      raster_image:
        format: webp
      svg:
        optimize: true

collections:
  - name: annual-reports
    label: Annual Reports
    label_singular: Annual Report
    folder: content/resources/annual-reports
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. 2026 Annual Report
      - name: year
        label: Year
        widget: string
        hint: ex. 2026
      - name: prepared-by
        label: Prepared By
        widget: string
        required: false
      - name: annual-report
        label: Annual Report
        widget: file
        max: 1
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/annual-reports
          default: false

  - name: publications
    label: Publications
    folder: content/research/publications
    create: true
    slug: '{{year}}-{{slug}}'
    summary: '{{year}} — {{title}}'
    fields:
      - name: title
        label: Title
        widget: string
        hint: ex. Reef Fish Biomass Recovery in Eastern Samar MPAs
      - name: authors
        label: Authors
        widget: string
        hint: Comma-separated, ex. J. Laurente, M. Dela Cruz
      - name: year
        label: Year
        widget: string
        default: "2026"
        hint: ex. 2026
      - name: outlet
        label: Journal / Outlet
        widget: string
        required: false
        hint: Journal, publisher, or venue, ex. Marine Pollution Bulletin
      - name: volume
        label: Volume / Issue
        widget: string
        required: false
        hint: ex. 109(2) or 541
      - name: pages
        label: Pages / Article
        widget: string
        required: false
        hint: ex. 744-750 or e70016
      - name: link
        label: External link
        widget: string
        required: false
        hint: URL to the article (Google Scholar, DOI, journal page)
      - label: PDF
        name: pdf
        widget: file
        max: 1
        required: false
        accept: application/pdf,.pdf
        media_libraries:
          cloudflare_r2:
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/publications
          default: false

  - name: programs
    label: Programs
    label_singular: Program
    folder: content/programs
    fields:
      - name: title
        label: Title 
        widget: string
        hint: ex. Educational Assistance Program
      - name: short-description
        label: Short Description    
        widget: text
      - name: status
        label: Status
        widget: select
        options: ['Completed', 'Active', 'Discontinued']
      - name: tag
        label: Tag
        widget: string
        hint: eg. Education
        required: false
      - name: featured-img
        label: Featured Image
        widget: file
        max: 1
        accept: "image/jpeg,.jpg,.jpeg"
      - name: body
        label: Content
        widget: markdown
        default: |
          ## About This Program

          Expand the short overview of the program here. Explain who it serves, what problem it addresses, and why it matters.

          ## Goals

          - Goal one
          - Goal two
          - Goal three

          ## Impact

          Describe the outcomes or results of the program so far. Include numbers or stories if available.

          ## How to Get Involved

          Explain how someone (a donor, volunteer, or participant) can support or join this program.

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: content/updates/announcements
    fields:
      - name: title 
        label: Title
        widget: string
      - name: author 
        label: Author
        widget: string
        required: false
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: excerpt
        label: Excerpt
        widget: string
        required: false
      - name: featured_image 
        label: Featured Image
        widget: image
        multiple: true
        required: false
        media_libraries:
          cloudflare_r2: 
            access_key_id: 9c671155033e705d9900c1857e7b81cc
            bucket: sveltia-media
            account_id: ffa0678267bca3257f3209173022c26f 
            public_url: https://pub-a32043e692ef4f1f91a01e5573fd355d.r2.dev
            prefix: gdfi-website-uploads/web-assets
          default: false
      - name: body 
        label: Body
        widget: text
        default: |
          Write a short, attention-grabbing opening line that restates or expands on the title.

          Give the context: what happened, who was involved, and why it matters to GDFI's mission.

          Share any key details, quotes, or numbers that support the announcement.

          End with a call to action or forward-looking note (e.g. how to get involved, what's next).